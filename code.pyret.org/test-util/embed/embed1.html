<html>
<head>
<script>
// Expect harness to pass this in as a URL param. To view on your own put the param or
// use the default 4999. An optional &compiler=ts|pyret suffix picks the
// editor's compiler flavor (forwarded to the iframe by embed1.js, the same
// way the embed library's `compiler` config option does).
const s = window.location.search;
const parts = (s === "" ? "http://localhost:4999" : s.substring(1)).split("&compiler=");
window.BASE_URL = parts[0];
window.EMBED_COMPILER = parts[1] || "";
</script>
<script src="embed-util.js"></script>
<script src="embed1.js"></script>
</head>
<body>
    <div style="width: 100%">
        <div id="container" style="display: inline-block; width: 49%">
        </div>
        <div id="messages" style="display: inline-block; width: 49%; height: 100%; overflow: scroll;">
        </div>   
    </div>
</body>
</html>
